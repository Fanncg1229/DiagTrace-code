[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagtrace"
version = "0.1.0"
description = "Evaluation code for DiagTrace interactive clinical trajectory reconstruction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openai>=1.0",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "scipy>=1.10",
  "seaborn>=0.13",
]

[project.optional-dependencies]
api = ["google-genai>=1.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
